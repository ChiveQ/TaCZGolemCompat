modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/lcy0x1/TaCZGolemCompat/issues"

[[mods]]
modId = "${modid}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

# Mixin config is declared here in 1.20.2+; the `MixinConfigs` manifest attribute is no longer enough.
[[mixins]]
config = "${modid}.mixins.json"

# If this block is omitted a fallback attempt is made to load META-INF/accesstransformer.cfg.
# It is declared explicitly so the location stays obvious while porting.
[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "l2library"
type = "required"
versionRange = "${l2library_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "modulargolems"
type = "required"
versionRange = "${modulargolems_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "tacz"
type = "required"
versionRange = "${tacz_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "curios"
type = "optional"
versionRange = "${curios_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "l2backpack"
type = "optional"
versionRange = "[3.0.0,)"
ordering = "NONE"
side = "BOTH"
