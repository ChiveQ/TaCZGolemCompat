// NeoForge 1.21.1 port build script.
//
// The project moved from ForgeGradle 6 (`fg.deobf`, `mixin` plugin, `reobfJar`, MixinExtras 0.2)
// to NeoForge's ModDevGradle 2. Everything is declared with NeoForge coordinates instead of
// `net.minecraftforge:forge`.
//
// Compatibility matrix with the old build:
//   Forge 1.20.1 / ForgeGradle 6   ->  NeoForge 1.21.1 / ModDevGradle 2
//   fg.deobf("group:name:version") ->  "group:name:version"            (Mojang mappings everywhere)
//   minecraft "net.minecraftforge:.." -> neoForge { version = neo_version }
//   org.spongepowered.mixin plugin ->  built into NeoForge 1.20.2+ (no plugin, no `mixin {}`)
//   mixinextras-forge 0.2.0        ->  bundled with NeoForge, MIXINEXTRAS is not a separate artifact
//   jarJar + reobfJarJar           ->  jarJar task, no reobf step
//   mods.toml                      ->  META-INF/neoforge.mods.toml

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mod_version}"
group = "${mod_group_id}.${modid}"

repositories {
    mavenLocal()
    // Mod jars that are not on any maven for 1.21.1 yet (Modular Golems, TaCZ and the libraries
    // that Modular Golems ships in its META-INF/jarjar).
    flatDir {
        dirs 'libs'
    }
    maven {
        // Registrate (a GAMELIBRARY that L2Library/libmods consume)
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
    maven {
        // Patchouli / JEI
        name = 'blamejared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        // Curios
        name = 'illusivec4'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        // L2 modules (l2library and friends) - used once they are published for 1.21.1
        name = 'L2'
        url = 'https://maven.iafenvoy.com/releases/'
        content {
            includeGroup 'dev.xkmc'
            includeGroup 'com.iafenvoy'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

base {
    archivesName = "${modid}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // NeoForge version, also decides which official (Mojang) mappings NFRT uses.
    version = "${neo_version}"

    // Fail the build on invalid AT targets instead of silently ignoring them.
    validateAccessTransformers = true
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', "${modid}"
        }

        data {
            data()
            gameDirectory = project.file('run')
            // `--existing-mod` is the 1.21.1 equivalent of the old `--existing-mod` args; add the
            // namespaces whose resources should be visible to the generators here.
            programArguments.addAll '--mod', "${modid}",
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'info'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${modid}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // ---- L2 stack ------------------------------------------------------------------------------
    // Modular Golems 3.1.44 hard-depends on l2library. It ships mob_weapon_api, l2damagetracker,
    // l2itemselector, l2tabs and cataclysm_mux inside META-INF/jarjar, which is why those jars are
    // in libs/ and declared here explicitly.
    //
    // l2library itself is NOT bundled by Modular Golems: drop the 1.21.1 jar into libs/ and
    // uncomment the next line (or point it back at a maven coordinate once it is published).
    implementation files('libs/l2library-3.0.8.jar')

    implementation files('libs/modulargolems-3.1.44.jar')
    implementation files('libs/mob_weapon_api-3.0.21.jar')
    implementation files('libs/l2damagetracker-3.0.5.jar')
    implementation files('libs/l2itemselector-3.1.6.jar')
    implementation files('libs/l2tabs-3.0.6+7.jar')
    implementation files('libs/cataclysm_mux-1.0.4.jar')

    // ---- TaCZ ----------------------------------------------------------------------------------
    // 68 MB NeoForge 1.21.1 build; the jar carries its own dependencies in META-INF/jarjar.
    implementation files('libs/tacz-neoforge-1.21.1-1.2.0.jar')

    // ---- Registrate (already provided by l2library at runtime) ---------------------------------
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    if (rootMod.toBoolean()) {
        implementation jarJar(group: 'com.tterrag.registrate', name: 'Registrate',
                version: "[${registrate_version},)")
    }

    // ---- optional mods -------------------------------------------------------------------------
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "mezz.jei:jei-${jei_minecraft_version}:${jei_version}"

    // Third-party curseforge dependencies are intentionally left as their 1.20.1 pins for the
    // moment; they need to be re-baselined before they resolve in a 1.21.1 workspace.
}

// Expand version placeholders in the mod metadata file.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            neo_version_range        : neo_version_range,
            loader_version_range     : loader_version_range,
            modid                    : modid,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            l2library_version_range  : l2library_version_range,
            modulargolems_version_range: modulargolems_version_range,
            tacz_version_range       : tacz_version_range,
            curios_version_range     : curios_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties// + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

jar {
    manifest {
        attributes([
                "Automatic-Module-Name"  : "${modid}",
                "Specification-Title"    : "${modid}",
                "Specification-Vendor"   : "${mod_authors}",
                "Specification-Version"  : "1",
                "Implementation-Title"   : project.name,
                "Implementation-Version" : project.jar.archiveVersion,
                "Implementation-Vendor"  : "${mod_authors}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'           : "${modid}.mixins.json"
        ])
    }
}

if (lljij.toBoolean()) {
    // `jarJar` here is ModDevGradle's JarJar task, which is not an AbstractArchiveTask and has no
    // archiveClassifier. Keep the plain `jar` as the fat artifact; the slim jar is the source jar.
    configurations.named('jarJar') {
        // Nothing to configure for now: everything embedded via `implementation jarJar(...)`.
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
