# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# ModDevGradle is configuration-cache compatible; set to false if a legacy data-gen script breaks it.
org.gradle.configuration-cache=true

## Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1,1.22)
# The Neo version must agree with the Minecraft version to get a valid artifact (21.1.x line; picks MCP official mappings)
neo_version=21.1.248
# The Neo version range can use any version of Neo as bounds
neo_version_range=[21.1.4,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

## Dependency version ranges (written into neoforge.mods.toml)
l2library_version_range=[3.0.0,)
modulargolems_version_range=[3.1.0,)
tacz_version_range=[1.2.0,)
curios_version_range=[9,)

## Mod Properties
modid=taczgolemcompat
mod_name=TaCZ Golem Compat
mod_license=LGPL-2.1
mod_version=1.0.0
mod_group_id=dev.xkmc
mod_authors=ChiveQ
mod_description=Allows Modular Golems to use guns from Timeless and Classics Zero, and to use guns from Pillager's Gun.
curseforge_project=1361628
modrinth_project=UsaRFpJh

## Optional-module switches (jarJar on/off, kept for parity with the 1.20.1 build)
lljij=true
rootMod=false

## Library versions that are NOT published to a maven for 1.21.1 yet.
# They are shipped inside libs/ instead; see build.gradle:
#   - modulargolems, tacz            : taken from dsh/ (versions above)
#   - mob_weapon_api 3.0.21          : META-INF/jarjar of modulargolems-3.1.44.jar
#   - l2damagetracker 3.0.5          : META-INF/jarjar of modulargolems-3.1.44.jar
#   - l2itemselector 3.1.6           : META-INF/jarjar of modulargolems-3.1.44.jar
#   - l2tabs 3.0.6+7                 : META-INF/jarjar of modulargolems-3.1.44.jar
#   - cataclysm_mux 1.0.4            : META-INF/jarjar of modulargolems-3.1.44.jar
# l2library is a REQUIRED dependency of Modular Golems: put a 1.21.1 l2library jar into libs/
# and uncomment the matching line in the dependency block.
registrate_version=MC1.21-1.3.0+67

## Maven-published dependencies
jei_minecraft_version=1.21.1-neoforge
jei_version=19.51.0.418
curios_version=9.2.2+1.21.1
patchouli_version=1.21-87-NEOFORGE-SNAPSHOT
